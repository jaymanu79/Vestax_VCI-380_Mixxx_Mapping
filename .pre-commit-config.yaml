# Same checks as the Mixxx repository (eslint + basic file hygiene).
# Setup:  pipx install pre-commit && pre-commit install
# Check everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-xml
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.9.1
    hooks:
      - id: eslint
        args: [--fix, --report-unused-disable-directives]
        files: \.m?js$
        types: [file]
        verbose: true # always show output so we don't swallow warnings
        additional_dependencies:
          - eslint@^10.9.1
          - "@eslint/js"
          - typescript-eslint
          - eslint-plugin-jsdoc@^v50.4.3
